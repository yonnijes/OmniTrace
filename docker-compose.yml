version: '3.8'

services:
  api:
    build:
      context: .
      target: api
    container_name: omnitrace-api
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - cache
    networks:
      - omnitrace-network

  web:
    build:
      context: .
      target: map-web

    container_name: omnitrace-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - omnitrace-network

  cache:
    image: redis:alpine
    container_name: omnitrace-cache
    ports:
      - "6379:6379"
    networks:
      - omnitrace-network
    volumes:
      - redis-data:/data

networks:
  omnitrace-network:
    driver: bridge

volumes:
  redis-data:
