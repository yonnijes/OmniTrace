version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nx-api
    volumes:
      - .:/app # Mapea tu código local al contenedor
      - /app/node_modules # Protege los node_modules del contenedor
    command: pnpm nx serve api --host 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    networks:
      - omnitrace-network
    depends_on:
      - cache

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nx-web
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm nx serve map-web --host 0.0.0.0
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - omnitrace-network

  cache:
    image: redis:alpine
    container_name: omnitrace-cache
    ports:
      - "6379:6379"
    networks:
      - omnitrace-network
    volumes:
      - redis-data:/data

networks:
  omnitrace-network:
    driver: bridge

volumes:
  redis-data:
